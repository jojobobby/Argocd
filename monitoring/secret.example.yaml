# EXAMPLE ONLY - do NOT commit a real secret. Grafana's admin credentials are read by
# the chart via `grafana.admin.existingSecret` (kube-prometheus-stack values), which
# points at the `grafana-admin-secret` Secret below. The Grafana pod cannot start until
# it exists, so create it in the `monitoring` namespace BEFORE (or at) first sync.
#
#   kubectl create namespace monitoring
#   kubectl -n monitoring create secret generic grafana-admin-secret \
#     --from-literal=admin-user="admin" \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
#
# Read the password back later with:
#   kubectl -n monitoring get secret grafana-admin-secret -o jsonpath='{.data.admin-password}' | base64 -d
#
# Or apply a manifest shaped like this (values are placeholders):
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "change-me-strong-admin-password"
