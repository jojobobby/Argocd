# haproxytech kubernetes-ingress 1.42.0 (controller 3.0.4), keyed by the subchart name.
#
# These are the values of the original hand-installed Helm release (`helm get values
# haproxy-ingress -n haproxy-ingress`) plus the two blocks marked ADDED. A render with only
# the original values was diffed against the live manifest before the takeover: every
# persistent resource (Deployment, Service, ConfigMap, RBAC, IngressClass) was identical, so
# adopting the release changed nothing but the ConfigMap. Anything you change here is
# picked up by the running controller through its ConfigMap - no pod restart.
kubernetes-ingress:
  controller:
    kind: Deployment
    ingressClassResource:
      default: true
    service:
      type: LoadBalancer
      # ADDED: the stats/metrics port used to be published on the public LoadBalancer IP
      # (http://147.135.8.100:1024/metrics answered from the internet with every backend
      # and host name in the cluster). Only the traffic ports stay public; metrics are
      # served to Prometheus through the dedicated ClusterIP metrics Service the chart
      # creates when the stat port is kept off the LoadBalancer.
      enablePorts:
        http: true
        https: true
        quic: true
        stat: false
        prometheus: false

    # ADDED: HAProxy's native Prometheus metrics (per-backend requests, response codes,
    # response times, sessions) scraped by the cluster-wide Prometheus - it selects
    # ServiceMonitors from every namespace, so no extra labels are needed.
    serviceMonitor:
      enabled: true

    # ADDED: the fallback certificate served for unknown hostnames is the self-signed Secret
    # the original install generated as a Helm pre-install hook (2026-05-01). Referencing it
    # as an existing secret stops the chart from re-generating it - under ArgoCD that hook
    # would otherwise rotate the certificate on EVERY sync. The rendered
    # --default-ssl-certificate argument is identical to the live one.
    defaultTLSSecret:
      enabled: true
      secret: haproxy-ingress-kubernetes-ingress-default-cert

    # ADDED: controller-wide configuration (haproxy.org global ConfigMap keys).
    config:
      # The controller listens on 8443 inside the pod and, by default, builds its HTTP->HTTPS
      # redirects with that port, so `http://<host>/` used to bounce every visitor to
      # https://<host>:8443/ - which nothing answers. The Service exposes 443; say so.
      ssl-redirect-port: "443"
