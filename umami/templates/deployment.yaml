apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicas }}
  # Umami runs its Prisma migrations at startup; two versions migrating the same
  # database at once is not something to invite.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
        app.kubernetes.io/component: server
    spec:
      initContainers:
        # The CNPG cluster takes a minute to come up on first install; wait for the
        # read-write service rather than crash-looping through the migration step.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ .Values.postgres.name }}-rw 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: umami
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-app
                  key: uri
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: TRACKER_SCRIPT_NAME
              value: {{ .Values.trackerScriptName | quote }}
            - name: COLLECT_API_ENDPOINT
              value: {{ .Values.collectApiEndpoint | quote }}
          # Migrations run before the server listens, so give startup room; once up,
          # the heartbeat is cheap.
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  labels:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: umami
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  number: 3000
