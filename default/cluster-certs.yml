# Cluster-wide cert-manager issuers, plus certificates that belong to no app's Ingress.
# 2026-11-08: removed the BetterUs certificates (each BetterUs Ingress makes its own; these
# duplicates pointed at the same Secrets and reported IncorrectCertificate) and the lts.cosmicv2.com
# certificate and /air/download redirect (it pointed at server.rrobinson.me:8802, which answers 503;
# the Cosmic appserver's own Ingress and certificate serve lts.cosmicv2.com).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: raphealbuisness@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: haproxy
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: raphealbuisness@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: haproxy
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: services.rrobinson.me
  namespace: default
spec:
  secretName: services.rrobinson.me
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - services.rrobinson.me
    - www.services.rrobinson.me
