# Cluster-wide store pointing at the self-managed OpenBao. Any namespace's
# ExternalSecret can reference it; the OpenBao policy `arcana-eso` scopes what
# this credential can actually read (tidan/data/arcana/*), so today only Arcana
# uses it. sync-wave 5 lets the ESO CRDs + webhook come up first; ArgoCD retries
# cover the brief window before the store reports Valid.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.kubernetesAuthMount | quote }}
          role: {{ .Values.openbao.role | quote }}
          serviceAccountRef:
            name: {{ .Values.openbao.serviceAccountName }}
            namespace: {{ .Release.Namespace }}
