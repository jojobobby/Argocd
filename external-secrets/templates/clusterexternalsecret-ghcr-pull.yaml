# One GitHub read token for every private ghcr.io/jojobobby image, entered once by the owner in
# OpenBao (mount tidan, path arcana/registry/ghcr, keys `username` and `token`; a classic token
# with only read:packages). This makes Secret `ghcr-pull` (kubernetes.io/dockerconfigjson) in
# every namespace labelled tidangames.com/ghcr-pull: "true". To add a namespace, label it from its
# Argo app (spec.syncPolicy.managedNamespaceMetadata.labels). Rotating the token is one edit in
# OpenBao; every namespace follows within the refresh interval. Nothing here holds a credential.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull
spec:
  namespaceSelectors:
    - matchLabels:
        tidangames.com/ghcr-pull: "true"
  refreshTime: 1m
  externalSecretName: ghcr-pull
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao
    target:
      name: ghcr-pull
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: {{`'{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'`}}
    data:
      - secretKey: username
        remoteRef:
          key: arcana/registry/ghcr
          property: username
      - secretKey: token
        remoteRef:
          key: arcana/registry/ghcr
          property: token
