# Login identity ESO's ClusterSecretStore presents to OpenBao's Kubernetes auth
# method. OpenBao reviews the login JWT with its own pod ServiceAccount (which
# already holds system:auth-delegator via openbao-server-binding), so this SA
# needs no cluster privileges of its own — it only has to exist and be bound to
# the `arcana-eso` OpenBao role by name + namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.openbao.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
